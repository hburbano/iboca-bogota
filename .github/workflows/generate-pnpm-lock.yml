name: Generate pnpm-lock
on:
  push:
    branches:
      - cursor/english-pnpm-968b
    paths:
      - .github/workflows/generate-pnpm-lock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile from package.json
        run: pnpm install --lockfile-only
      - name: Commit lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/generate-pnpm-lock.yml
          git add pnpm-lock.yaml
          git add -u .github/workflows/generate-pnpm-lock.yml || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Add pnpm-lock.yaml"
          git push
